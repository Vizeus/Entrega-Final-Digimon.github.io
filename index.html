<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digimon</title>

    <link rel="shortcut icon" href="./img/favicon.ico" type="image/png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Enlaces a los scripts. El orden importa: primero los idiomas (i18n.js), después la página (main.js) y por último
         los filtros y las ventanas de información, que usan lo que definen los anteriores -->
    <script defer src="./i18n.js"></script>
    <script defer src="./main.js"></script>
    <script defer src="./filtros.js"></script>
    <script defer src="./info.js"></script>
    <script defer src="./evolucion.js"></script>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Orbitron (nombres), Pixelify Sans (etiquetas y botones), Exo 2 (textos) y DotGothic16 (descripción del dorso) -->
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Exo+2:wght@400;500;600;700&family=Orbitron:wght@800;900&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./design/styles.css"/>
</head>

<body>

<!-- Los textos que llevan data-i18n (o data-i18n-html / data-i18n-attr) se traducen con i18n.js.
     Lo que está escrito acá es el texto en español, que se reemplaza según el idioma de la persona. -->

<!-- Barra de navegación sticky -->
<nav id="navbar">
    <img src="./img/DigimonLogo.png" alt="Logo de Digimon" title="Logo de Digimon" class="animate__animated animate__bounce"
         data-i18n-attr="alt:logo.alt;title:logo.alt">

    <!-- Panel de combate: la consigna, cuántos digimons van elegidos y el botón principal, todo junto -->
    <div class="combate">
        <p class="consigna" data-i18n="combate.consigna">Elige 2 digimons con los que quieras simular un combate</p>
        <span id="contador-seleccion" class="contador" title="Digimons elegidos" aria-live="polite"
              data-i18n-attr="title:combate.contador">0/2</span>
        <!-- Empieza deshabilitado: se activa al elegir 2 digimons -->
        <button id="iniciar-combate" class="botones" disabled title="Elige 2 digimons para poder iniciar el combate"
                data-i18n="combate.iniciar" data-i18n-attr="title:combate.iniciar.ayuda">Iniciar Combate</button>
    </div>

    <!-- En celular: botón ☰ que abre el menú con la consigna, los ajustes y los menús de información -->
    <button type="button" id="abrir-menu" class="botones" aria-expanded="false" aria-controls="menu-movil"
            title="Más opciones" aria-label="Más opciones" data-i18n-attr="title:menu.abrir;aria-label:menu.abrir">
        <span aria-hidden="true">☰</span>
    </button>

    <!-- En computadora este contenedor no existe para el diseño (display: contents) y todo queda en la barra, como siempre.
         En celular es el panel que se despliega con el botón ☰ -->
    <div id="menu-movil" class="menu-movil">
    <p class="menu-consigna" data-i18n="combate.consigna">Elige 2 digimons con los que quieras simular un combate</p>

    <!-- Ajustes: sistema de clasificación de niveles (la banderita) e idioma. Van juntos, en el centro de la barra -->
    <div class="ajustes">
        <button id="cambiar-niveles" class="nivel-japon botones" title="Cambiar sist. de clasificación de niveles"
                aria-label="Cambiar sist. de clasificación de niveles"
                data-i18n-attr="title:niveles.cambiar;aria-label:niveles.cambiar"></button>

        <!-- Idioma: muestra los dos y resalta el que está activo. Al inicio se elige solo, según el idioma del navegador -->
        <button type="button" id="cambiar-idioma" title="Cambiar idioma (Español / English)"
                aria-label="Cambiar idioma (Español / English)"
                data-i18n-attr="title:idioma.cambiar;aria-label:idioma.cambiar">
            <span data-idioma="es" class="activo">ES</span><span data-idioma="en">EN</span>
        </button>
    </div>

    <!-- Herramientas de la barra (secundarias): tres menús de información. Cada uno es un botón de verdad, se abre con clic
         (o Enter/Espacio) y se cierra con Esc o al hacer clic afuera. Las opciones las escribe info.js (así siguen el idioma) -->
    <div class="herramientas">
        <div class="menu-info">
            <button type="button" id="abrir-tipos" class="menu-desplegable" aria-haspopup="true" aria-expanded="false" aria-controls="lista-tipos"
                    data-i18n="menu.tipos">Info. tipos</button>
            <ul id="lista-tipos"></ul>
        </div>

        <div class="menu-info">
            <button type="button" id="abrir-elementos" class="menu-desplegable" aria-haspopup="true" aria-expanded="false" aria-controls="lista-elementos"
                    data-i18n="menu.elementos">Info. elementos</button>
            <ul id="lista-elementos"></ul>
        </div>

        <div class="menu-info">
            <button type="button" id="abrir-niveles" class="menu-desplegable" aria-haspopup="true" aria-expanded="false" aria-controls="lista-niveles"
                    data-i18n="menu.niveles">Info. niveles</button>
            <ul id="lista-niveles"></ul>
        </div>
    </div>
    </div><!-- /menu-movil -->

    <div class="carga">
        <label for="carga" data-i18n-html="carga.rotulo">Progreso de la carga de <br>Digimons:</label>
        <progress id="carga" value="" max=""></progress>
    </div>
</nav>

<!-- Filtros y buscador. Los botones con las opciones (los "chips") los arma filtros.js -->
<section id="filtros" aria-label="Filtros y buscador de digimons" data-i18n-attr="aria-label:filtros.region">
    <span class="f-titulo"><span aria-hidden="true">🔎</span> <span data-i18n="filtros.titulo">Filtros</span></span>

    <label class="f-buscar">
        <span class="f-lupa" aria-hidden="true">🔍</span>
        <input type="text" role="searchbox" autocomplete="off" spellcheck="false"
               placeholder="Buscar digimon por nombre o número" aria-label="Buscar digimon por nombre o número"
               data-i18n-attr="placeholder:filtros.buscar;aria-label:filtros.buscar">
        <button type="button" class="f-x" hidden title="Borrar búsqueda" aria-label="Borrar búsqueda"
                data-i18n-attr="title:filtros.borrarBusqueda;aria-label:filtros.borrarBusqueda">✕</button>
    </label>

    <div class="f-grupo" data-g="tipo">
        <button type="button" class="f-btn" aria-haspopup="true" aria-expanded="false">
            <span data-i18n="filtros.tipo">Tipo</span><b class="f-n" hidden>0</b>
        </button>
        <div class="f-panel" role="group" aria-label="Filtrar por tipo" data-i18n-attr="aria-label:filtros.porTipo"></div>
    </div>

    <div class="f-grupo" data-g="nivel">
        <button type="button" class="f-btn" aria-haspopup="true" aria-expanded="false">
            <span data-i18n="filtros.nivel">Nivel</span><b class="f-n" hidden>0</b>
        </button>
        <div class="f-panel" role="group" aria-label="Filtrar por nivel" data-i18n-attr="aria-label:filtros.porNivel"></div>
    </div>

    <div class="f-grupo" data-g="elemento">
        <button type="button" class="f-btn" aria-haspopup="true" aria-expanded="false">
            <span data-i18n="filtros.elemento">Elemento</span><b class="f-n" hidden>0</b>
        </button>
        <div class="f-panel" role="group" aria-label="Filtrar por elemento" data-i18n-attr="aria-label:filtros.porElemento"></div>
    </div>

    <!-- Filtros activos: uno por cada opción elegida (se sacan con un clic) -->
    <div class="f-activos" aria-label="Filtros activos" data-i18n-attr="aria-label:filtros.activos"></div>

    <div class="f-resumen">
        <span class="f-cuenta" aria-live="polite"></span>
        <button type="button" class="f-limpiar" hidden data-i18n="filtros.limpiar">Limpiar ✕</button>
    </div>
</section>

<!-- Aviso cuando ningún digimon cumple los filtros -->
<div id="f-vacio" hidden>
    <p data-i18n="filtros.vacio">😕 Ningún digimon cumple esa combinación.</p>
    <button type="button" class="f-limpiar" data-i18n="filtros.limpiarTodo">Limpiar filtros</button>
</div>

<!-- Listado de Digimons -->
<ul id="listado-digimons"></ul>

</body>

</html>
